databases:
  - name: nitro-velocity-db
    plan: free
    databaseName: nitrovelocity
    user: nitro

services:
  # API — build context is ./backend, so `COPY package.json ./` finds it.
  - type: web
    name: nitro-velocity-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nitro-velocity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

  # Frontend (nginx) — build context is the repo root.
  - type: web
    name: nitro-velocity-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # After the first deploy, copy the API service's public URL here
      # (Render dashboard -> nitro-velocity-api -> the onrender.com URL)
      # and redeploy the web service.
      - key: API_URL
        value: https://nitro-velocity-api.onrender.com
