version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nitrovelocity
      POSTGRES_USER: nitro
      POSTGRES_PASSWORD: nitro_pass_change_me
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nitro:nitro_pass_change_me@db:5432/nitrovelocity
      JWT_SECRET: change_this_secret_in_production
      PORT: 4000
    depends_on:
      - db
    ports:
      - "4000:4000"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:10000"

volumes:
  db_data:
